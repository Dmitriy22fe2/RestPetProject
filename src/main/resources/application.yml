spring:
  application:
    name: RestPetProject
  datasource:
    driverClassName: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5492/${DB_NAME:rest_pet_project_db}
    username: ${DB_USERNAME:admin}
    password: ${DB_PASSWORD:password}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        show_sql: true
        format_sql: true
